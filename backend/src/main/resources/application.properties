spring.application.name=tripboard
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tripboard}
spring.datasource.username=${DB_USER:tripboard}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
tripboard.jwt-secret=${JWT_SECRET}
tripboard.demo=${DEMO_DATA:false}
tripboard.demo-password=${DEMO_PASSWORD:}
