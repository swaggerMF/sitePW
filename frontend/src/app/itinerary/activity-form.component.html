<form #f="ngForm" (ngSubmit)="saved.emit(model)">
  <label
    >Activity name<input
      name="title"
      [(ngModel)]="model.title"
      required
      maxlength="120"
      placeholder="A waterfall worth the detour" /></label
  ><label
    >Location<input
      name="location"
      [(ngModel)]="model.location"
      maxlength="200"
      placeholder="Where are we heading?"
  /></label>
  <div class="form-grid">
    <label
      >Date<input
        type="date"
        name="date"
        [(ngModel)]="model.date"
        [min]="ctx.trip()!.startDate"
        [max]="ctx.trip()!.endDate"
        required /></label
    ><label
      >Start time<input
        type="time"
        name="startTime"
        [(ngModel)]="model.startTime"
        required
    /></label>
  </div>
  <label
    >Estimated cost per person ({{ ctx.currency }})<input
      type="number"
      name="estimatedCost"
      [(ngModel)]="model.estimatedCost"
      min="0"
      max="9999999999.99"
      step="0.01"
      required /></label
  ><label
    >Notes<textarea
      name="description"
      [(ngModel)]="model.description"
      maxlength="2000"
      placeholder="Anything the crew should know"
    ></textarea>
  </label>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <div class="form-actions">
    <button type="button" (click)="cancelled.emit()">Cancel</button
    ><button class="primary" [disabled]="f.invalid || busy()">
      {{ busy() ? "Saving…" : "Save activity" }}
    </button>
  </div>
</form>
