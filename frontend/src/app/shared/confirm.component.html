<app-modal [title]="title()" (closed)="cancelled.emit()"
  ><p>{{ message() }}</p>
  <div class="form-actions">
    <button (click)="cancelled.emit()">Cancel</button
    ><button class="danger" [disabled]="busy()" (click)="confirmed.emit()">
      {{ busy() ? "Please wait…" : confirmLabel() }}
    </button>
  </div></app-modal
>
