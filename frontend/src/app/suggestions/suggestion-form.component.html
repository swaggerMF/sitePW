<form #f="ngForm" (ngSubmit)="saved.emit(model)">
  <label
    >What’s the idea?<input
      name="title"
      [(ngModel)]="model.title"
      required
      maxlength="120"
      placeholder="A dip in the Blue Lagoon" /></label
  ><label
    >Location<input
      name="location"
      [(ngModel)]="model.location"
      maxlength="200"
      placeholder="Where would we go?" /></label
  ><label
    >Estimated cost per person ({{ ctx.currency }})<input
      name="estimatedCost"
      type="number"
      [(ngModel)]="model.estimatedCost"
      min="0"
      max="9999999999.99"
      step="0.01"
      required /></label
  ><label
    >Make the case<textarea
      name="description"
      [(ngModel)]="model.description"
      maxlength="2000"
      placeholder="Why should this make the itinerary?"
    ></textarea>
  </label>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <div class="form-actions">
    <button type="button" (click)="cancelled.emit()">Cancel</button
    ><button class="primary" [disabled]="f.invalid || busy()">
      {{ busy() ? "Saving…" : "Save idea" }}
    </button>
  </div>
</form>
